[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --strict-markers
    -p no:cacheprovider
markers =
    slow: test takes noticeable wall-clock time
    integration: exercises several modules together
    gui: builds real Qt widgets
    bug: documents a defect found in the production code
filterwarnings =
    ignore::DeprecationWarning
